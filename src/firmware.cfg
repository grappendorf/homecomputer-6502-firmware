# Microsoft BASIC workspace is $0440-$7EFF (see docs/system-spec.md).
# $0200-$0278 is the BASIC line buffer (BUFPAG=2, 120 characters + NUL).
# $0100-$010F is FBUFFR, on the 6502 stack page, as in the original.
# Driver RAM is $0279-$043F (LCD, SID, serial-BASIC ring).
MEMORY {
    ZP:   start = $0000, size = $0100, file = "";
    RAM:  start = $0279, size = $01C7, file = "";
    ROM:  start = $8000, size = $7F80, fill = yes, fillval = $FF, file = %O;
    API:  start = $FF80, size = $007A, fill = yes, fillval = $FF, file = %O;
    VEC:  start = $FFFA, size = $0006, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
    CODE:     load = ROM,  type = ro;
    KERNAL:   load = API,  type = ro;
    VECTORS:  load = VEC,  type = ro;
}
